name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.x

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint governed docs and config
        run: >-
          npx prettier --check AGENTS.md README.md .docpact/config.yaml package.json "docs/agents/**/*.{md,yml,yaml,json}" ".github/workflows/*.{yml,yaml}"

      - name: Schema boundary negative and capability tests
        run: >-
          deno test --allow-read --config supabase/functions/deno.json test/schema_boundary_consumer_audit_test.ts test/schema_boundary_capability_test.ts

      - name: Schema boundary expand audit
        run: npm run audit:schema-boundary:expand

      - name: Schema boundary contract remains fail-closed before DB freeze
        shell: bash
        run: |
          if npm run audit:schema-boundary:contract > schema-boundary-contract.json 2>&1; then
            echo "Contract unexpectedly passed before database-engine #357 freeze" >&2
            exit 1
          fi
          grep -q 'database-freeze-pending' schema-boundary-contract.json
          grep -q 'public-relation-residue' schema-boundary-contract.json

      - name: Deno check baseline
        run: npm run check
