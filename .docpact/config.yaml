version: 1
layout: repo
lastReviewedAt: '2026-08-13'
lastReviewedCommit: 'f54afcf18548a21cae08d93a01a4ae78040bf367'
lastReviewedNote: 'Edge review submission now targets stable cmd_review_submit without Gate authority, and Review Admin quality diagnostics use one manual start/read API with server-derived scope.'

# Keep deterministic governance facts here.
# AGENTS.md stays as the repo contract entrypoint.
# Narrow source docs keep proof and repo-shape explanations.
catalog:
  repos:
    - id: edge-functions
      path: .
      canonicalRepo: linancn/tiangong-lca-edge-functions
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: edge-runtime-and-shared-modules
      paths:
        include:
          - supabase/functions/**
      ownerRepo: edge-functions
    - id: repo-validation-deploy-and-ops-surface
      paths:
        include:
          - test/**
          - scripts/**
          - package.json
          - supabase/config.toml
          - supabase/.env.example
          - test.example.http
          - .github/workflows/ci.yml
      ownerRepo: edge-functions
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - .docpact/**
          - docs/agents/**
          - .github/workflows/ai-doc-lint.yml
          - .github/PULL_REQUEST_TEMPLATE/**
      ownerRepo: edge-functions

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: edge-functions

coverage:
  include:
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - AGENTS.md
    - README.md
    - .docpact/**
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - .github/PULL_REQUEST_TEMPLATE/*.md
    - .github/workflows/ai-doc-lint.yml
    - .github/workflows/ci.yml
    - package.json
    - supabase/config.toml
    - supabase/.env.example
    - supabase/functions/**
    - test/**
    - scripts/**
    - test.example.http
  exclude:
    - .git/**
    - .github/scripts/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    function-runtime:
      paths:
        - supabase/functions/*/index.ts
        - supabase/functions/*/handler.ts
        - supabase/functions/**
    auth-runtime:
      paths:
        - supabase/functions/_shared/auth.ts
        - supabase/functions/_shared/cognito_auth.ts
        - supabase/functions/_shared/decode_api_key.ts
        - scripts/probe-functions-auth.cjs
        - test.example.http
    command-runtime:
      paths:
        - supabase/functions/app_dataset_*/**
        - supabase/functions/app_review_*/**
        - supabase/functions/app_team_*/**
        - supabase/functions/app_user_*/**
        - supabase/functions/admin_*/**
        - supabase/functions/_shared/command_runtime/**
        - supabase/functions/_shared/commands/**
        - supabase/functions/_shared/db_rpc/**
    data-product-runtime:
      paths:
        - supabase/functions/app_data_product_commands/**
        - supabase/functions/data_product_results/**
        - supabase/functions/_shared/commands/data_product/**
        - supabase/functions/_shared/db_rpc/data_product_commands.ts
        - test/data_product_command_test.ts
        - test/data_product_results_test.ts
    lca-release-runtime:
      paths:
        - supabase/functions/app_lca_release_commands/**
        - supabase/functions/lca_release_results/**
        - supabase/functions/_shared/commands/lca_release/**
        - supabase/functions/_shared/db_rpc/lca_release_commands.ts
        - test/lca_release_command_test.ts
        - test/lca_release_results_test.ts
        - supabase/.env.example
        - README.md
        - docs/agents/repo-architecture.md
        - docs/agents/repo-validation.md
        - test.example.http
    review-quality-diagnostic:
      paths:
        - supabase/functions/admin_review_quality_diagnostic/**
        - supabase/functions/_shared/commands/review/quality_diagnostic.ts
        - supabase/functions/_shared/commands/review/types.ts
        - supabase/functions/_shared/commands/review/validation.ts
        - supabase/functions/_shared/commands/review/repository.ts
        - supabase/functions/_shared/db_rpc/review_commands.ts
        - test/admin_review_quality_diagnostic_test.ts
        - supabase/functions/app_dataset_review_submit_gate/**
        - supabase/functions/app_dataset_review_submit_jobs/**
        - supabase/functions/app_dataset_submit_review/**
        - supabase/functions/app_worker_jobs/**
        - supabase/functions/process_dataset_review_submit_jobs/**
        - supabase/functions/_shared/commands/worker_jobs.ts
        - supabase/functions/_shared/commands/dataset/review_submit_gate.ts
        - supabase/functions/_shared/commands/dataset/review_submit_jobs.ts
        - supabase/functions/_shared/commands/dataset/submit_review.ts
        - supabase/functions/_shared/commands/dataset/types.ts
        - supabase/functions/_shared/commands/dataset/validation.ts
        - supabase/functions/_shared/db_rpc/dataset_commands.ts
        - supabase/functions/_shared/db_rpc/worker_jobs.ts
        - supabase/functions/_shared/review_submit_job_worker.ts
        - test/app_dataset_review_submit_gate_test.ts
        - test/app_dataset_review_submit_jobs_test.ts
        - test/app_dataset_submit_review_test.ts
        - test/app_worker_jobs_test.ts
        - test/dataset_command_rpc_contract_test.ts
        - test/review_submit_job_worker_test.ts
        - test/worker_jobs_test.ts
        - README.md
        - test.example.http
    search-and-embedding:
      paths:
        - supabase/functions/flow_hybrid_search/**
        - supabase/functions/process_hybrid_search/**
        - supabase/functions/lifecyclemodel_hybrid_search/**
        - supabase/functions/contact_hybrid_search/**
        - supabase/functions/flowproperty_hybrid_search/**
        - supabase/functions/source_hybrid_search/**
        - supabase/functions/unitgroup_hybrid_search/**
        - supabase/functions/process_dataset_extraction_jobs/**
        - supabase/functions/ai_suggest/**
        - supabase/functions/embedding*
        - supabase/functions/webhook_*embedding*
        - supabase/functions/_shared/dataset_extraction_worker.ts
        - supabase/functions/_shared/embedding_ft_job.ts
        - supabase/functions/_shared/embedding_vector.ts
        - supabase/functions/_shared/flow_extraction.ts
        - supabase/functions/_shared/foundation_dataset_extraction.ts
        - supabase/functions/_shared/hybrid_search_handler.ts
        - supabase/functions/_shared/hybrid_search_request.ts
        - supabase/functions/_shared/hybrid_search_rpc_context.ts
        - supabase/functions/_shared/openai_*.ts
        - supabase/functions/_shared/hybrid_query_utils.ts
    lca-runtime:
      paths:
        - supabase/functions/lca_*/**
        - supabase/functions/_shared/lca_process_scope.ts
        - supabase/functions/_shared/lca_snapshot_scope.ts
        - supabase/functions/_shared/lca_snapshot_build_queue.ts
        - supabase/functions/_shared/lca_snapshot_capabilities.ts
        - supabase/functions/_shared/lca_all_unit_solve_queue.ts
