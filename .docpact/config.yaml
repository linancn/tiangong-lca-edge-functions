    tidas-package:
      paths:
        - supabase/functions/import_tidas_package/**
        - supabase/functions/export_tidas_package/**
        - supabase/functions/tidas_package_jobs/**
        - supabase/functions/_shared/tidas_package.ts
        - supabase/functions/_shared/redis_client.ts
    deploy-auth-drift:
      paths:
        - package.json
        - supabase/config.toml
        - supabase/.env.example
        - scripts/deploy-function.cjs
        - scripts/probe-functions-auth.cjs
        - .github/PULL_REQUEST_TEMPLATE/*.md
        - README.md
    proof:
      paths:
        - test/**
        - scripts/deno-check-all.cjs
        - scripts/probe-functions-auth.cjs
        - scripts/run_scope_closure_edge_qualification.sh
        - scripts/scope_closure_edge_qualification.ts
        - .github/workflows/ci.yml
        - docs/agents/repo-validation.md
        - test.example.http
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/**
        - docs/agents/**
        - .github/PULL_REQUEST_TEMPLATE/*.md
    root-integration:
      paths:
        - AGENTS.md
        - .github/PULL_REQUEST_TEMPLATE/promote-dev-to-main.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - .github/PULL_REQUEST_TEMPLATE/feature-to-dev.md
    - .github/PULL_REQUEST_TEMPLATE/promote-dev-to-main.md

repo:
  id: edge-functions
  owner: edge-functions

rules:
  - id: edge-functions-bootstrap-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained source docs must stay aligned.
  - id: edge-functions-readme-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: README.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: Repo landing text should stay aligned with the active repo contract and docpact entry surface.
  - id: edge-functions-feature-pr-template-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: .github/PULL_REQUEST_TEMPLATE/feature-to-dev.md
        kind: doc-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: .github/PULL_REQUEST_TEMPLATE/feature-to-dev.md
        mode: review_or_update
    reason: The feature-to-dev PR template should stay aligned with the repo's active M2 branch and handoff contract.
  - id: edge-functions-promote-pr-template-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: .github/PULL_REQUEST_TEMPLATE/promote-dev-to-main.md
        kind: doc-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: .github/PULL_REQUEST_TEMPLATE/promote-dev-to-main.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: The promote-to-main template should stay aligned with the repo's release-path, proof, and back-merge contract.
  - id: edge-functions-runtime-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: supabase/functions/**
        kind: runtime-code
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Runtime changes can alter repo boundaries, routing, validation scope, and hotspot ownership.
  - id: edge-functions-review-quality-diagnostic-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: supabase/functions/admin_review_quality_diagnostic/**
        kind: runtime-code
      - path: supabase/functions/_shared/commands/review/quality_diagnostic.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/review/types.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/review/validation.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/review/repository.ts
        kind: runtime-code
      - path: supabase/functions/_shared/db_rpc/review_commands.ts
        kind: runtime-code
      - path: test/admin_review_quality_diagnostic_test.ts
        kind: runtime-test
      - path: supabase/functions/app_dataset_review_submit_gate/**
        kind: runtime-code
      - path: supabase/functions/app_dataset_review_submit_jobs/**
        kind: runtime-code
      - path: supabase/functions/app_dataset_submit_review/**
        kind: runtime-code
      - path: supabase/functions/app_worker_jobs/**
        kind: runtime-code
      - path: supabase/functions/process_dataset_review_submit_jobs/**
        kind: runtime-code
      - path: supabase/functions/_shared/commands/worker_jobs.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/dataset/review_submit_gate.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/dataset/review_submit_jobs.ts
        kind: runtime-code
      - path: supabase/functions/_shared/commands/dataset/submit_review.ts
        kind: runtime-code
      - path: supabase/functions/_shared/db_rpc/dataset_commands.ts
        kind: runtime-code
      - path: supabase/functions/_shared/db_rpc/worker_jobs.ts
        kind: runtime-code
      - path: supabase/functions/_shared/review_submit_job_worker.ts
        kind: runtime-code
      - path: test/app_dataset_review_submit_gate_test.ts
        kind: runtime-test
      - path: test/app_dataset_review_submit_jobs_test.ts
        kind: runtime-test
      - path: test/app_dataset_submit_review_test.ts
        kind: runtime-test
      - path: test/app_worker_jobs_test.ts
        kind: runtime-test
      - path: test/review_submit_job_worker_test.ts
        kind: runtime-test
      - path: test/worker_jobs_test.ts
        kind: runtime-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: test.example.http
        mode: must_exist
    reason: Direct review submission and the Review Admin-only manual quality diagnostic must preserve server-derived scope, informational outcomes, stable database RPCs, and the temporary legacy Gate/coordinator compatibility boundary.
  - id: edge-functions-lca-release-runtime-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: supabase/functions/app_lca_release_commands/**
        kind: runtime-code
      - path: supabase/functions/lca_release_results/**
        kind: runtime-code
      - path: supabase/functions/_shared/commands/lca_release/**
        kind: runtime-code
      - path: supabase/functions/_shared/db_rpc/lca_release_commands.ts
        kind: runtime-code
      - path: test/lca_release_command_test.ts
        kind: runtime-test
      - path: test/lca_release_results_test.ts
        kind: runtime-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: test.example.http
        mode: review_or_update
    reason: The release command and read projections jointly define actor authorization, service-only artifact verification, and the public immutable download boundary.
  - id: edge-functions-proof-and-ci-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: test/**
        kind: runtime-test
      - path: scripts/**
        kind: validation-or-ops-script
      - path: scripts/deno-check-all.cjs
        kind: validation-wrapper
      - path: scripts/run_scope_closure_edge_qualification.sh
        kind: qualification-adapter
      - path: scripts/scope_closure_edge_qualification.ts
        kind: qualification-adapter
      - path: .github/workflows/ci.yml
        kind: automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Test inventory and CI baseline changes alter the proof story for future runtime work.
  - id: edge-functions-deploy-and-ops-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: package.json
        kind: runtime-config
      - path: supabase/config.toml
        kind: deploy-config
      - path: supabase/.env.example
        kind: env-template
      - path: scripts/deploy-function.cjs
        kind: deploy-script
      - path: scripts/probe-functions-auth.cjs
        kind: ops-script
      - path: scripts/lca_submit_poll_fetch.sh
        kind: ops-script
      - path: test.example.http
        kind: request-collection
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Deploy targets, auth probes, and request collections define how runtime behavior is checked and handed off.
  - id: edge-functions-ai-doc-maintenance-contract
    scope: repo
    repo: edge-functions
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Documentation-governance automation changes should refresh the repo contract and maintenance guidance together.
  - id: edge-functions-local-docpact-push-gate
    scope: repo
    repo: edge-functions
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
